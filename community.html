<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community | The Name of the Group</title>

  <style>
    :root {
      --paper: #f7f3eb;
      --ink: #171411;
      --muted: #6f675f;
      --rule: #cfc5b8;
      --accent: #6f1d1b;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
      color: var(--ink);
      background: var(--paper);
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    header {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 22px;
      margin-bottom: 56px;
    }

    .site-nav {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 40px;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .site-nav a {
      color: var(--muted);
      text-decoration: none;
    }

    .site-nav a:hover {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 5rem);
      line-height: 0.95;
      font-weight: normal;
      max-width: 820px;
      margin: 0;
    }

    .notice {
      max-width: 620px;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      padding: 28px 0;
      color: var(--muted);
      font-size: 1.12rem;
    }

    footer {
      border-top: 1px solid var(--rule);
      margin-top: 56px;
      padding-top: 18px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 720px) {
      .page {
        padding-top: 32px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="calendar.html">Calendar</a>
        <a href="members.html">Members</a>
        <a href="community.html">Community</a>
      </nav>

      <h1>Community</h1>
    </header>

    <main>
      <div class="notice">
        <p>
          Nothing is currently scheduled.
        </p>

        <p>
          Check back for future public events, talks, screenings, and other
          occasional gatherings.
        </p>
      </div>
    </main>

    <footer>
      The Name of the Group / Columbia, South Carolina
    </footer>
  </div>
</body>
</html>
